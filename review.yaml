# SkyNet README 的 agent-reviewed 规则评审
#
# 评审对象：./README.md
# 评审时间：2026-09-27
# 项目类型：service（FastAPI 后端服务，无 Web UI）
# 用法：pnpm readme-craft check . --type service --review review.yaml
#
# 背景：SkyNet 是纯后端服务（FastAPI + Celery + PostgreSQL），
# 除 FastAPI 自动生成的 /docs（Swagger UI）外没有可视界面。
# 因此多项面向 GUI / Web 应用的规则在此按 N/A 处理，而非强行补图。

specVersion: 3.0.0-alpha.0

reviews:
  # T01 视觉锤：后端服务无品牌视觉资产时用架构图兜底
  - id: T01
    score: 3
    reason: >-
      标题 + tagline + badge 矩阵齐备，并以架构链接与分层说明补足信息密度。
      扣 2 分：首屏没有任何视觉资产（无架构图、无流程图、无 Swagger 截图），
      后端服务读者需要在纯文字中自行想象系统形态。
      修正方向：把 07 设计分层或 Swagger UI 截图放进首屏。
    evidence: [logo-tagline]

  # T02 三秒价值主张
  - id: T02
    score: 4
    reason: >-
      「这是什么」章节给出定位（企业数据智能平台）并用一句话概括价值链路
      （散落数据 → 可信指标 → 业务洞察），同时给出选择理由（Polars 高性能处理 +
      Celery 任务调度 + Claude Agent 推送链路），三层信息齐备。
      扣 1 分：目标用户（数据分析师 / 运营团队）未在首屏点明，
      需读到模块章节才能推断使用场景。
    evidence: [value-proposition]

  # T04 安装路径
  - id: T04
    score: 3
    reason: >-
      给出 Dockerfile / docker-compose 两条部署路径与依赖说明。
      扣 2 分：路径不可直接复制执行（缺完整的环境变量准备与数据库初始化步骤），
      且未覆盖从源码直接运行的路径。
    evidence: [executable-command, supported-platforms]

  # T05 Quickstart
  - id: T05
    score: 4
    reason: >-
      给出 uvicorn / celery 启动命令、Swagger UI 地址，并补充了
      `curl -s http://127.0.0.1:8000/health` 的最小验证（含预期输出），
      读者可独立确认服务是否真正可用。
      扣 1 分：仍需本地准备 .env 与数据库，无一键体验入口。
    evidence: [quickstart-steps]

  # T07 卖点编号
  - id: T07
    score: 2
    reason: >-
      以模块列表（metrics / ingestion / agents / storage / tasks）说明能力范围。
      扣 3 分：没有「粗体关键词 + 一行量化收益」的结构，各模块只有职责描述，
      没有任何指标（吞吐、数据规模、延迟）支撑价值主张。
    evidence: [numbered-selling-points]

  # T08 Feature 分组
  - id: T08
    score: 3
    reason: >-
      按模块维度分组（数据接入 / 指标 / 智能体 / 存储 / 异步任务），分组结构清晰。
      扣 2 分：各组内是平铺的模块名，没有说明成熟度差异，
      读者无法判断哪些能力可用、哪些仍是骨架。
    evidence: [feature-groups]

  # T11 引用/背书
  - id: T11
    status: na
    reason: >-
      项目处于早期开发阶段（README 明确标注「开发状态」），无外部用户可引用。
      不伪造客户或引用；待有真实使用方后再补。

  # T14 包容性语言
  - id: T14
    score: 4
    reason: >-
      全文使用中性称谓（「企业」「团队」「读者」），无 he/she 默认指代与性别化表述；
      技术名词均附中文解释。
      扣 1 分：部分句子较长且使用「天网」等可能引起歧义的比喻，未给中性说明。
    evidence: [inclusive-language-review]

  # T17 默认语言策略
  - id: T17
    score: 4
    reason: >-
      首屏显式声明默认语言为简体中文并说明面向企业内部中文团队，
      同时说明英文版暂未提供、欢迎 PR 补充 README.en.md，策略与后续动作均明确。
      扣 1 分：策略仅在首屏一处提及，未在贡献指南中重复。
    evidence: [default-language-rationale]
